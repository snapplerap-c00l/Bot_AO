name: Playtest bot

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "allout.game link to playtest"
        required: true
        type: string
      observe_minutes:
        description: "How many minutes to observe"
        required: false
        default: "5"
        type: string
      screenshot_interval_seconds:
        description: "Seconds between screenshots"
        required: false
        default: "20"
        type: string
      bot_count:
        description: "How many bots to run in parallel (max 10)"
        required: false
        default: "1"
        type: string

jobs:
  playtest:
    runs-on: ubuntu-latest
    # Auto-scales with however long you ask it to observe, plus a 15-minute
    # buffer for setup, disconnect/rejoin overhead, and report generation -
    # so you never have to remember to raise this separately.
    timeout-minutes: ${{ fromJSON(inputs.observe_minutes) + 15 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run playtester bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OBSERVE_MINUTES: ${{ inputs.observe_minutes }}
          SCREENSHOT_INTERVAL_SECONDS: ${{ inputs.screenshot_interval_seconds }}
          BOT_COUNT: ${{ inputs.bot_count }}
        run: node index.js "${{ inputs.game_url }}"

      - name: Post report to job summary
        if: always()
        run: |
          REPORT_FILE=$(find runs -name "report.md" | head -n 1)
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report.md found — check the uploaded artifact for screenshots/logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-run
          path: runs/
          retention-days: 14
